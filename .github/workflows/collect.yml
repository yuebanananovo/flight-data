name: 每日采集机票价格

on:
  schedule:
    - cron: '17 1 * * *'   # 每天日本时间 10:17（GitHub 用 UTC 时间）
  workflow_dispatch:        # 也可以在 Actions 页面手动点 “Run workflow”
    inputs:
      backfill:
        description: '回填过去约两个月的价格（只需要跑一次）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 采集价格
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.FLY }}
          PLAN: ${{ vars.PLAN }}
        run: python scripts/collect.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: 保存数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "数据更新 $(date -u +%F)"
          git push
