name: 每日采集机票价格

on:
  schedule:
    - cron: '17 1 * * *'   # 每天日本时间 10:17（GitHub 用 UTC 时间）
  workflow_dispatch:        # 也可以在 Actions 页面手动点 “Run workflow”
    inputs:
      stats_only:
        type: boolean
        default: false
        description: '仅用已保存的日历重新统计，不请求 SerpApi'
      calendar_only:
        type: boolean
        default: false
        description: '只刷新半年单程日历'
      departure:
        description: '可选：指定从东京出发的单程日期（YYYY-MM-DD），同时取同月日历'
        type: string
        required: false
      backfill:
        description: '回填过去约两个月的价格（只需要跑一次）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 采集价格
        if: ${{ !inputs.stats_only }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.FLY }}
          PLAN: ${{ vars.PLAN }}
          DEPARTURE: ${{ inputs.departure }}
          CALENDAR_ONLY: ${{ inputs.calendar_only }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ -n "$DEPARTURE" ]; then
            python scripts/trip.py "$DEPARTURE"
          elif [ "$CALENDAR_ONLY" = true ]; then
            python scripts/collect.py --calendar-only
          elif [ "$BACKFILL" = true ]; then
            python scripts/collect.py --backfill
          else
            python scripts/collect.py
          fi
      - name: 汇总每月最低价和并列出发日
        run: python scripts/monthly_lows.py
      - name: 保存数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "数据更新 $(date -u +%F)"
          git push
