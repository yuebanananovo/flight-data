name: 每日采集机票价格

on:
  schedule:
    - cron: '17 1 * * *'   # 每天日本时间 10:17（GitHub 用 UTC 时间）
  workflow_dispatch:        # 也可以在 Actions 页面手动点 “Run workflow”
    inputs:
      holiday_history:
        type: boolean
        default: false
        description: '恢复完整价格历史并用免费余量补圣诞至年初的四个方向'
      stats_only:
        type: boolean
        default: false
        description: '仅用已保存的日历重新统计，不请求 SerpApi'
      calendar_only:
        type: boolean
        default: false
        description: '只刷新半年单程日历'
      backfill:
        description: '回填过去约两个月的价格（只需要跑一次）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 采集价格
        if: ${{ !inputs.stats_only }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.FLY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          DAILY_SEARCHAPI_LIMIT: ${{ vars.DAILY_SEARCHAPI_LIMIT }}
          SEARCHAPI_RESERVE: ${{ vars.SEARCHAPI_RESERVE }}
          PLAN: ${{ vars.PLAN }}
          CALENDAR_ONLY: ${{ inputs.calendar_only }}
          HOLIDAY_HISTORY: ${{ inputs.holiday_history }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$HOLIDAY_HISTORY" = true ]; then
            python scripts/holiday_history.py
          elif [ "$CALENDAR_ONLY" = true ]; then
            python scripts/collect.py --calendar-only
          elif [ "$BACKFILL" = true ]; then
            python scripts/collect.py --backfill
          else
            python scripts/collect.py
          fi
      - name: 汇总每月最低价和并列出发日
        run: |
          python scripts/monthly_lows.py
          python scripts/observations.py
      - name: 保存数据
        if: ${{ !cancelled() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRIOR_STATUS" = success ]; then
            git add data
          else
            git add data/collector-status.json
            if [ -d data/quote-observations ]; then git add data/quote-observations; fi
          fi
          git diff --cached --quiet || git commit -m "数据更新 $(date -u +%F)"
          git push
